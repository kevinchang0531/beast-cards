[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="config/online.cfg"
exclude_filter="tests/*, art_src/*, tools/*, firebase/*"
export_path="build/web/index.html"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<link rel='manifest' href='manifest.webmanifest'>
<style>
html, body { background: #000; overscroll-behavior: none; touch-action: none; }
#bc-rotate { display: none; }
@media (orientation: portrait) and (pointer: coarse) {
  #bc-rotate { display: flex; position: fixed; inset: 0; z-index: 90; align-items: center; justify-content: center;
    background: #0e1628; color: #ffe27a; font: bold 26px sans-serif; }
}
</style>
<script>
window.__bcFullscreen = function () {
  var d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
  var req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return;
  var r = req.call(el, { navigationUI: 'hide' });
  if (r && r.then) r.then(function () {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
  }).catch(function () {});
};
if (matchMedia('(pointer: coarse)').matches) {
  var bcAuto = function () {
    removeEventListener('pointerup', bcAuto, true);
    removeEventListener('touchend', bcAuto, true);
    if (!document.fullscreenElement) window.__bcFullscreen();
  };
  addEventListener('pointerup', bcAuto, true);
  addEventListener('touchend', bcAuto, true);
}
document.addEventListener('DOMContentLoaded', function () {
  var d = document.createElement('div');
  d.id = 'bc-rotate';
  d.textContent = '請把裝置轉成橫向';
  document.body.appendChild(d);
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=false
